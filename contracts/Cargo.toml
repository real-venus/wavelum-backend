[workspace]
members = [
    "malicious-contract",
    "reentrancy-tests",
    "vesting-vault"
]
# merkle_vault is a work-in-progress (issue #51) that does not yet compile:
# it pins a different soroban-sdk major than the workspace and uses APIs that
# don't type-check (env.crypto().sha256() returns Hash<32>, not BytesN<32>, and
# env.serialize() is not a soroban-sdk method). Excluded from the workspace
# build until it is completed; move it back into `members` once it compiles.
exclude = [
    "merkle_vault"
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "21.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
overflow-checks = true
